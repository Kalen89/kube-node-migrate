apiVersion: v1
kind: Namespace
metadata:
  name: migration-demo
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: migration-demo
spec:
  clusterIP: None
  selector:
    app: migration-demo
  ports:
    - name: http
      port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app
  namespace: migration-demo
spec:
  serviceName: app
  replicas: 1
  selector:
    matchLabels:
      app: migration-demo
  template:
    metadata:
      labels:
        app: migration-demo
    spec:
      containers:
        - name: app
          image: docker.io/rancher/mirrored-library-busybox:1.36.1
          # Verification data is written once by the operator before migration.
          # Never recreate it on startup: an empty destination must fail verification.
          command: [sh, -c, 'exec sleep 86400']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
