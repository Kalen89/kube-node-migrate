# 使用稳定的 Service、VIP 或平台健康端点，不使用迁移中会变化的 Pod IP。
excludeNamespaces: [kube-system]
pvConcurrency: 1
precopy: true
precopyRounds: 3
precopyThreshold: 0s
rsyncBandwidthLimit: 0
helper:
  image: docker.io/rancher/mirrored-library-busybox:1.36.1
sshd:
  image: docker.io/utkuozdemir/pv-migrate-sshd:v3.7.0
rsync:
  image: docker.io/utkuozdemir/pv-migrate-rsync:v3.7.0
healthChecks:
  - name: platform-health
    url: https://cwpp.example.com/health
    expectedStatus: 200
    insecureSkipVerify: false
