excludeNamespaces: [kube-system]
# Use stable Service or platform endpoints; Pod IPs change during migration.
reserve:
  cpu: 200m
  memory: 256Mi
  pods: 2
# Instance migration is serial; this value must remain 1.
pvConcurrency: 1
# KiB/s per rsync stream; 0 means unlimited, not an aggregate bandwidth cap.
rsyncBandwidthLimit: 0
# Keep the source Pod running during initial rounds. Final cutover still stops it.
precopy: true
precopyRounds: 3
# 0s: finish successful rounds; >0: require measured rsync runtime within threshold.
# Neither mode proves consistency; stopped-source final sync and digests are mandatory.
precopyThreshold: 0s
# Keep digest scans serial on shared disks; true overlaps full source/target reads
# after the final checksum sync, without skipping either scan or verification.
parallelDigest: false
helper:
  image: docker.io/rancher/mirrored-library-busybox:1.36.1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
sshd:
  image: docker.io/utkuozdemir/pv-migrate-sshd:v3.7.0
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
rsync:
  image: docker.io/utkuozdemir/pv-migrate-rsync:v3.7.0
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
# Optional extra checks run before and after the business migration.
# In-cluster readiness probes are always checked through Pod Ready.
healthChecks: []
